<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Standard Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="msapplication-TileColor" content="#3B82F6" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    
    <!-- Apple iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Argo" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    
    <!-- Splash Screens for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <!-- General Meta Tags -->
    <meta name="description" content="Professional expense tracking and management for trade shows and events. Track receipts, manage approvals, and generate reports." />
    <meta name="keywords" content="expense tracking, trade show, expense management, receipts, approvals, reports" />
    <meta name="author" content="Argo" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Argo" />
    <meta property="og:description" content="Professional expense tracking and management for trade shows and events" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    
    <title>Argo</title>

    <!-- Self-hosted fonts: preload both variable files so text renders in the
         final face on first paint (font-display: swap covers slow loads) -->
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Service Worker Cleanup - runs before app loads -->
    <script>
      // Unregister stale service workers and clear caches so users get fresh content.
      // The push notification worker (push-sw.js) is kept — it has no fetch handler
      // or caching, so it can't serve stale content.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            var worker = reg.active || reg.waiting || reg.installing;
            var isPushWorker = !!(worker && worker.scriptURL && worker.scriptURL.indexOf('push-sw.js') !== -1);
            if (!isPushWorker) { reg.unregister(); }
          });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
